name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/FreightDesk.Tests

      - name: Build
        run: dotnet build tests/FreightDesk.Tests --no-restore

      - name: Test
        run: dotnet test tests/FreightDesk.Tests --no-build
